<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태화기업 AI 진단 안내</title>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: linear-gradient(180deg, #f4f8fb 0%, #eef3f8 100%);
      color: #1d2733;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 20px 80px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d8dee6;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 44px rgba(148, 163, 184, 0.14);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      color: #5c6b7a;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .card {
      border: 1px solid #d8dee6;
      border-radius: 22px;
      padding: 22px;
      background: linear-gradient(180deg, #fff 0%, #f8fbff 100%);
    }

    .card strong {
      display: block;
      font-size: 1.15rem;
      margin-bottom: 10px;
      color: #1c2f6e;
    }

    .card span {
      display: block;
      color: #5c6b7a;
      line-height: 1.6;
      min-height: 72px;
    }

    .button {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    .primary {
      background: #1e63ff;
      color: #fff;
    }

    .secondary {
      background: #eaf3f2;
      color: #0f766e;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <h1>태화기업 AI 진단 안내</h1>
      <p>기업은 사전 수준진단 설문만 작성하고 저장해 주세요. 저장된 응답은 AI훈련코치(강사회)가 결과분석 화면에서 확인합니다.</p>

      <div class="grid">
        <div class="card">
          <strong>1. 기업 사전 수준진단</strong>
          <span>태화기업 실무 담당자가 응답 정보를 입력하고 진단 항목을 체크한 뒤 사전 수준진단을 저장하는 화면입니다.</span>
          <a class="button primary" href="./taehwa_ai_diagnostic_guide.html">기업 진단 작성하기</a>
        </div>

        <div class="card">
          <strong>2. AI훈련코치(강사회) 결과분석 보고서</strong>
          <span>AI훈련코치(강사회)가 저장된 응답을 모아 보고, 점수와 메모를 기준으로 결과분석 보고서를 확인하는 화면입니다.</span>
          <a class="button secondary" href="./admin_dashboard.html">결과분석 보고서 열기</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
